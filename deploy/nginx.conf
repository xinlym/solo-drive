# Include this file in Nginx http context (sites-enabled or conf.d).
# Zones are dedicated to Solo Drive and do not affect other virtual hosts.
limit_req_zone $binary_remote_addr zone=solo_drive_requests:2m rate=20r/s;
limit_req_zone $binary_remote_addr zone=solo_drive_login:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=solo_drive_connections:2m;
limit_conn_zone $server_name zone=solo_drive_total:1m;
map "$status:$upstream_http_retry_after" $solo_drive_retry_after {
    default "";
    "429:" 5;
    "503:" 5;
}

# Existing VPS: HAProxy terminates HTTPS, then forwards only this host here.
# First ensure HAProxy overwrites X-Forwarded-For with the real client address.
server {
    listen 127.0.0.1:8092;
    server_name drive.example.com;
    server_tokens off;

    # Trust only the local HAProxy hop, never arbitrary Internet senders.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    client_max_body_size 0;
    client_body_timeout 300s;
    send_timeout 120s;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    gzip off;
    limit_req zone=solo_drive_requests burst=80 nodelay;
    limit_req_status 429;
    limit_conn solo_drive_connections 32;
    limit_conn solo_drive_total 128;
    limit_conn_status 429;
    # Suppress attacker-generated limit logs containing share-token URLs.
    limit_req_log_level notice;
    limit_conn_log_level notice;
    add_header Retry-After $solo_drive_retry_after always;

    # Share tokens are bearer secrets. Avoid writing full token paths to logs.
    access_log off;
    error_log /var/log/nginx/solo-drive-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    location = /api/login {
        limit_req zone=solo_drive_login burst=5 nodelay;
        client_max_body_size 16k;
        client_body_timeout 15s;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
}
