# Existing VPS: HAProxy terminates HTTPS, then forwards only this host here.
# First ensure HAProxy overwrites X-Forwarded-For with the real client address.
server {
    listen 127.0.0.1:8092;
    server_name drive.example.com;
    server_tokens off;

    # Trust only the local HAProxy hop, never arbitrary Internet senders.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    client_max_body_size 0;
    client_body_timeout 3600s;
    send_timeout 3600s;
    gzip off;

    # Share tokens are bearer secrets. Avoid writing full token paths to logs.
    access_log off;
    error_log /var/log/nginx/solo-drive-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
}
