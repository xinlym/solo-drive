# Merge these lines into the EXISTING TLS-terminating HTTP frontend.
# Do not create another listener on :443 or replace existing routing rules.
# Adapt the hostname. These header rules must execute before use_backend.
#
# acl host_solo_drive hdr(host) -i drive.example.com drive.example.com:443
# http-request set-header X-Forwarded-For %[src] if host_solo_drive
# http-request set-header X-Forwarded-Proto https if host_solo_drive
# use_backend solo_drive if host_solo_drive
#
# The frontend's timeout client is an inactivity timeout, not a total upload
# duration. Review it for slow or interrupted transfers; do not blindly replace
# a shared frontend's settings. Keep share URL paths out of access logs.

backend solo_drive
    mode http
    timeout connect 5s
    timeout server 1h
    timeout queue 5s
    server solo_drive_nginx 127.0.0.1:8092 check maxconn 128 maxqueue 32

# For a dedicated Solo Drive HTTPS frontend, also use:
# maxconn 256
# timeout http-request 10s
# timeout http-keep-alive 30s
# Keep HTTP/2 enabled; application limits count active requests, not TCP sockets.
