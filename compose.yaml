name: solo-drive
services:
  drive:
    image: solo-drive:0.3.0
    build:
      context: .
    user: "10001:10001"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    init: false
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      SOLODRIVE_ADDR: "0.0.0.0:8091"
      SOLODRIVE_DATA_DIR: /data
      SOLODRIVE_PUBLIC_URL: ${SOLODRIVE_PUBLIC_URL:?Set SOLODRIVE_PUBLIC_URL in .env}
      SOLODRIVE_ADMIN_USER: ${SOLODRIVE_ADMIN_USER:-admin}
      SOLODRIVE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SOLODRIVE_RESERVE_BYTES: ${SOLODRIVE_RESERVE_BYTES:-5368709120}
      SOLODRIVE_COOKIE_SECURE: ${SOLODRIVE_COOKIE_SECURE:-true}
      SOLODRIVE_SESSION_HOURS: ${SOLODRIVE_SESSION_HOURS:-168}
      SOLODRIVE_TRUSTED_PROXY_CIDRS: ${SOLODRIVE_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      SOLODRIVE_REQUESTS_PER_MINUTE: ${SOLODRIVE_REQUESTS_PER_MINUTE:-600}
      SOLODRIVE_REQUEST_BURST: ${SOLODRIVE_REQUEST_BURST:-60}
      SOLODRIVE_DOWNLOADS_PER_IP: ${SOLODRIVE_DOWNLOADS_PER_IP:-16}
      SOLODRIVE_PUBLIC_DOWNLOADS: ${SOLODRIVE_PUBLIC_DOWNLOADS:-48}
      SOLODRIVE_DOWNLOADS_PER_SHARE: ${SOLODRIVE_DOWNLOADS_PER_SHARE:-32}
      GOMEMLIMIT: 192MiB
    volumes:
      - solodrive_data:/data
      - type: bind
        source: ./secrets/admin_password.txt
        target: /run/secrets/admin_password
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/solodrive", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  solodrive_data:
    name: solo-drive-data
